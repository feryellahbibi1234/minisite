<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Feed Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Feed</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Profile</a></li>
                <li><a href="#">Messages</a></li>
            </ul>
        </nav>
    </header>

    <div class="feed">
        <div class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/40?img=1" alt="Jane Doe">
                <h3>Jane Doe <span class="timestamp">2h ago</span></h3>
            </div>
            <p>Just had the best coffee ever ☕✨</p>
        </div>
        <div class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/40?img=2" alt="John Smith">
                <h3>John Smith <span class="timestamp">5h ago</span></h3>
            </div>
            <p>What a beautiful sunset today 🌅</p>
        </div>
        <div class="post">
            <div class="post-header">
                <img src="https://i.pravatar.cc/40?img=3" alt="Alice Blue">
                <h3>Alice Blue <span class="timestamp">1d ago</span></h3>
            </div>
            <p>Feeling grateful for everything. 💖</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 My Feed. All rights reserved.</p>
    </footer>
</body>
</html>
